<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; padding: 16px; font-family: system-ui, sans-serif; font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input, select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .status { margin-top: 12px; padding: 8px; border-radius: 6px; background: #f0f0f0; }
  .status.ok { background: #e6f7e6; }
  .status.err { background: #fde8e8; }
  button { margin-top: 12px; width: 100%; padding: 8px; border: none; border-radius: 6px; background: #7c3aed; color: white; font-weight: 600; cursor: pointer; }
  button:hover { background: #6d28d9; }
  .hint { color: #666; font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
  <h1>🎙️ Ailia TTS <span style="font-size:11px;color:#666">v0.2.0 local</span></h1>

  <div class="row">
    <input type="checkbox" id="enabled" style="width:auto">
    <label for="enabled" style="margin:0">TTS 활성화</label>
  </div>

  <label for="ttsServerUrl">로컬 TTS 서버</label>
  <input id="ttsServerUrl" placeholder="ws://127.0.0.1:18766">
  <div class="hint">기본값: ws://127.0.0.1:18766 (같은 PC)<br>다른 PC의 서버: ws://192.168.x.x:18766</div>

  <label for="voice">음성</label>
  <select id="voice">
    <option value="ailia">에일리아 (기본)</option>
  </select>
  <div class="hint">CosyVoice3 음성 클로닝 기반</div>

  <div class="status" id="status">서버 URL을 확인하고 저장하세요.</div>
  <button id="save">저장</button>
  <button id="test" style="background:#059669">연결 테스트</button>

  <h1 style="margin-top:16px">🧪 스트리밍 테스트</h1>

  <label for="testText">테스트 문장</label>
  <input id="testText" placeholder="비워두면 기본 문장 사용" value="안녕하세요, 주인님! 에일리아 음성 테스트 중이에요.">
  <div class="hint">서버 로그에서 수신 확인, 오디오는 여기서 재생</div>

  <button id="testAudio" style="background:#2563eb">🔊 오디오 스트리밍 테스트<br><span style="font-size:11px;font-weight:400">서버 → 확장 (합성+재생)</span></button>
  <button id="testText" style="background:#d97706">📝 텍스트 스트리밍 테스트<br><span style="font-size:11px;font-weight:400">확장 → 서버 (전송 확인)</span></button>
  <div class="status" id="testStatus" style="display:none"></div>

<script src="popup.js"></script>
</body>
</html>
